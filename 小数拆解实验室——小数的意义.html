<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小数拆解实验室 - 小数的意义</title>
    <style>
        :root {
            --bg: #fdf6e3;
            --card-bg: #ffffff;
            --primary: #4a90d9;
            --primary-hover: #357abd;
            --accent: #f08c3c;
            --accent-hover: #d9742a;
            --success: #3cb878;
            --success-hover: #2d9d64;
            --text: #2c3e50;
            --text-light: #5a6c7d;
            --border: #d5dfe8;
            --highlight: #ffb74d;
            --highlight-strong: #ff9800;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
            --radius: 18px;
            --radius-sm: 10px;
            --font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, #e8f0fe 0%, #fdf6e3 30%, #fef9e7 60%, #eaf4e8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .main-container {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            padding: 28px 32px 32px;
            max-width: 820px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            border: 1px solid #e8edf3;
        }

        .header {
            text-align: center;
        }

        .header .title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a3c5e;
            letter-spacing: 0.03em;
            margin-bottom: 2px;
        }

        .header .subtitle {
            font-size: 0.9rem;
            color: #7a8c9d;
            font-weight: 400;
        }

        /* 模式标签切换 */
        .mode-tabs {
            display: flex;
            gap: 6px;
            background: #f0f4f8;
            border-radius: 30px;
            padding: 5px;
            width: fit-content;
            margin: 0 auto;
        }

        .mode-tab {
            padding: 10px 24px;
            border-radius: 26px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: transparent;
            color: #6b7d8e;
            letter-spacing: 0.02em;
            white-space: nowrap;
            font-family: var(--font-family);
            position: relative;
        }

        .mode-tab.active {
            background: #ffffff;
            color: #1a3c5e;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .mode-tab:hover:not(.active) {
            color: #3a5a7c;
            background: rgba(255, 255, 255, 0.5);
        }
        .mode-tab .badge {
            display: inline-block;
            font-size: 0.7rem;
            background: #ffe0b2;
            color: #e65100;
            border-radius: 10px;
            padding: 2px 8px;
            margin-left: 6px;
            font-weight: 500;
            vertical-align: middle;
        }
        .mode-tab.active .badge {
            background: #ffcc80;
        }

        /* 展示区 */
        .display-area {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: center;
            align-items: flex-start;
            min-height: 380px;
            position: relative;
        }

        /* 正方形容器 */
        .square-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .square-label {
            font-size: 0.85rem;
            color: #5a6c7d;
            font-weight: 500;
            letter-spacing: 0.03em;
            text-align: center;
            min-height: 20px;
        }

        .canvas-container {
            position: relative;
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow);
            background: #fff;
            transition: var(--transition);
            border: 2px solid #e0e5ea;
        }
        .canvas-container:hover {
            border-color: #c5cdd5;
        }
        .canvas-container.main-square {
            /* 主正方形10cm */
            width: 10cm;
            height: 10cm;
            border: 3px solid #3a5168;
            border-radius: 6px;
            box-shadow: var(--shadow-lg);
        }
        .canvas-container.sub-square {
            width: 6.5cm;
            height: 6.5cm;
            border: 2.5px solid #4a6078;
            border-radius: 5px;
        }
        .canvas-container.sub-square-small {
            width: 5.5cm;
            height: 5.5cm;
            border: 2.5px solid #4a6078;
            border-radius: 5px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: inherit;
        }

        /* 控制区 */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            justify-content: center;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 11px 20px;
            border-radius: 26px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            letter-spacing: 0.03em;
            font-family: var(--font-family);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-split {
            background: #e8f0fb;
            color: #3a6090;
            border: 2px solid #c8d8ed;
        }
        .btn-split.active-split {
            background: #4a90d9;
            color: #fff;
            border-color: #4a90d9;
            box-shadow: 0 3px 12px rgba(74, 144, 217, 0.35);
        }
        .btn-split:hover:not(.active-split) {
            background: #dce8f5;
            border-color: #a8c4e0;
        }
        .btn-generate {
            background: #f08c3c;
            color: #fff;
            font-size: 1rem;
            padding: 12px 28px;
            box-shadow: 0 3px 14px rgba(240, 140, 60, 0.35);
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .btn-generate:hover {
            background: #e07a2a;
            box-shadow: 0 5px 20px rgba(240, 140, 60, 0.45);
        }
        .btn-reset {
            background: #f5f5f5;
            color: #666;
            border: 2px solid #ddd;
        }
        .btn-reset:hover {
            background: #ebebeb;
            border-color: #bbb;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafb;
            border-radius: 28px;
            padding: 6px 8px 6px 18px;
            border: 2px solid #dde3e9;
            transition: var(--transition);
        }
        .input-group:focus-within {
            border-color: #f08c3c;
            box-shadow: 0 0 0 4px rgba(240, 140, 60, 0.08);
            background: #fff;
        }

        .input-group input {
            border: none;
            background: transparent;
            font-size: 1.05rem;
            font-weight: 600;
            color: #2c3e50;
            width: 100px;
            outline: none;
            font-family: var(--font-family);
            letter-spacing: 0.03em;
            text-align: center;
        }
        .input-group input::placeholder {
            color: #bcc5cd;
            font-weight: 400;
            font-size: 0.9rem;
        }
        .input-group .input-hint {
            font-size: 0.8rem;
            color: #8899a6;
            white-space: nowrap;
            padding-right: 4px;
        }

        /* 分数显示 */
        .fraction-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #2c3e50;
            min-height: 50px;
            flex-wrap: wrap;
            padding: 8px 16px;
            background: #fdfcf8;
            border-radius: var(--radius-sm);
            border: 1px dashed #e0dcd0;
        }
        .fraction-display .label-text {
            color: #5a6c7d;
            font-weight: 500;
        }
        .fraction-display .equals {
            font-size: 1.3rem;
            color: #888;
            margin: 0 4px;
        }
        .frac-box {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            line-height: 1;
            margin: 0 2px;
        }
        .frac-box .numerator {
            font-size: 1.3rem;
            font-weight: 700;
            color: #c0392b;
            padding: 0 6px;
        }
        .frac-box .frac-line {
            display: block;
            width: 100%;
            min-width: 28px;
            height: 2.5px;
            background: #2c3e50;
            border-radius: 1px;
            margin: 3px 0;
        }
        .frac-box .denominator {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2471a3;
            padding: 0 6px;
        }

        /* 格数显示 */
        .grid-count {
            font-weight: 700;
            color: #e67e22;
            font-size: 1.15rem;
            background: #fff8f0;
            padding: 4px 12px;
            border-radius: 16px;
            display: inline-block;
        }

        /* 进阶模式正方形行 */
        .advanced-squares-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            align-items: flex-start;
        }

        .square-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .square-group .group-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a6078;
            background: #eef3f8;
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: 0.03em;
        }
        .square-group .group-value {
            font-size: 0.9rem;
            font-weight: 700;
            color: #c0392b;
        }

        /* 动画提示 */
        .anim-hint {
            text-align: center;
            font-size: 0.8rem;
            color: #8899a6;
            min-height: 20px;
            transition: opacity 0.3s;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .main-container {
                padding: 16px 12px 20px;
                gap: 16px;
                border-radius: 18px;
            }
            .header .title {
                font-size: 1.4rem;
            }
            .canvas-container.main-square {
                width: 7.5cm;
                height: 7.5cm;
            }
            .canvas-container.sub-square {
                width: 5cm;
                height: 5cm;
            }
            .canvas-container.sub-square-small {
                width: 4.2cm;
                height: 4.2cm;
            }
            .btn {
                padding: 9px 15px;
                font-size: 0.85rem;
            }
            .btn-generate {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            .input-group input {
                width: 70px;
                font-size: 0.95rem;
            }
            .display-area {
                gap: 12px;
                min-height: auto;
            }
            .advanced-squares-row {
                gap: 8px;
            }
            .frac-box .numerator,
            .frac-box .denominator {
                font-size: 1.05rem;
            }
        }
        @media (max-width: 480px) {
            .canvas-container.main-square {
                width: 6cm;
                height: 6cm;
            }
            .canvas-container.sub-square {
                width: 3.8cm;
                height: 3.8cm;
            }
            .canvas-container.sub-square-small {
                width: 3.2cm;
                height: 3.2cm;
            }
            .mode-tab {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            .btn {
                padding: 7px 12px;
                font-size: 0.78rem;
            }
            .square-group .group-label {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- 头部 -->
        <div class="header">
            <div class="title">📐 小数拆解实验室</div>
            <div class="subtitle">小数的意义</div>
        </div>

        <!-- 模式切换 -->
        <div class="mode-tabs">
            <button class="mode-tab active" id="tabNormal" onclick="switchMode('normal')">
                📏 普通模式 <span class="badge">＜1</span>
            </button>
            <button class="mode-tab" id="tabAdvanced" onclick="switchMode('advanced')">
                🧩 进阶模式 <span class="badge">＞1</span>
            </button>
        </div>

        <!-- 展示区 -->
        <div class="display-area" id="displayArea">
            <!-- 普通模式展示 -->
            <div id="normalDisplay" style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;">
                <div class="square-wrapper">
                    <div class="square-label">边长为 <strong>10cm</strong> 的正方形</div>
                    <div class="canvas-container main-square" id="mainSquareContainer">
                        <canvas id="mainCanvas"></canvas>
                    </div>
                </div>
                <!-- 分割模式切换按钮 -->
                <div class="btn-group">
                    <button class="btn btn-split active-split" id="btnCols10" onclick="setSplitMode('columns10')">
                        ▦ 平均分成 <strong>10列</strong>
                    </button>
                    <button class="btn btn-split" id="btnGrid100" onclick="setSplitMode('grid100')">
                        ▩ 平均分成 <strong>100小格</strong>
                    </button>
                </div>
                <div class="anim-hint" id="animHint">👆 点击上方按钮可切换分割方式，观察动态变化</div>
            </div>

            <!-- 进阶模式展示 -->
            <div id="advancedDisplay" style="display:none;width:100%;">
                <div class="advanced-squares-row" id="advancedSquaresRow">
                    <div style="text-align:center;color:#8899a6;padding:40px;">
                        🧩 请输入一个大于1的小数<br>（例如：<strong>2.23</strong>），然后点击"生成"
                    </div>
                </div>
            </div>
        </div>

        <!-- 控制区 -->
        <div class="controls">
            <div class="input-group">
                <span class="input-hint" id="inputHint">小数：</span>
                <input type="text" id="decimalInput" placeholder="如 0.3" maxlength="8" inputmode="decimal">
            </div>
            <button class="btn btn-generate" onclick="generate()" title="点击生成图示">
                ✨ 生 成
            </button>
            <button class="btn btn-reset" onclick="resetAll()" title="清除所有内容">
                🔄 重置
            </button>
        </div>

        <!-- 结果显示 -->
        <div class="fraction-display" id="fractionDisplay">
            <span class="label-text">📝 在此显示小数对应的分数和格子数</span>
        </div>
    </div>

    <script>
        (function() {
            // ==================== DOM元素引用 ====================
            const tabNormal = document.getElementById('tabNormal');
            const tabAdvanced = document.getElementById('tabAdvanced');
            const normalDisplay = document.getElementById('normalDisplay');
            const advancedDisplay = document.getElementById('advancedDisplay');
            const advancedSquaresRow = document.getElementById('advancedSquaresRow');
            const mainCanvas = document.getElementById('mainCanvas');
            const mainSquareContainer = document.getElementById('mainSquareContainer');
            const btnCols10 = document.getElementById('btnCols10');
            const btnGrid100 = document.getElementById('btnGrid100');
            const animHint = document.getElementById('animHint');
            const decimalInput = document.getElementById('decimalInput');
            const inputHint = document.getElementById('inputHint');
            const fractionDisplay = document.getElementById('fractionDisplay');

            // ==================== 状态管理 ====================
            let currentMode = 'normal'; // 'normal' | 'advanced'
            let splitMode = 'columns10'; // 'columns10' | 'grid100'
            let currentDecimalValue = null; // 当前有效的小数值
            let isAnimating = false;
            let animationId = null;
            let animationProgress = 0; // 0=纯10列, 1=纯100格（用于动画过渡）
            let animationStartTime = 0;
            const ANIM_DURATION = 550; // 动画持续时间ms

            // 初始化animationProgress
            if (splitMode === 'columns10') animationProgress = 0;
            else animationProgress = 1;

            // ==================== Canvas初始化 ====================
            function initMainCanvas() {
                const rect = mainSquareContainer.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const displayWidth = rect.width;
                const displayHeight = rect.height;
                if (displayWidth <= 0 || displayHeight <= 0) {
                    // 延迟初始化
                    requestAnimationFrame(initMainCanvas);
                    return;
                }
                mainCanvas.width = Math.floor(displayWidth * dpr);
                mainCanvas.height = Math.floor(displayHeight * dpr);
                mainCanvas.style.width = displayWidth + 'px';
                mainCanvas.style.height = displayHeight + 'px';
                drawMainCanvas();
            }

            function getMainCanvasCtx() {
                const ctx = mainCanvas.getContext('2d');
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
                return { ctx, width: mainCanvas.width / dpr, height: mainCanvas.height / dpr, dpr };
            }

            // ==================== 绘制主正方形 ====================
            function drawMainCanvas() {
                const { ctx, width, height } = getMainCanvasCtx();
                const w = width;
                const h = height;
                const margin = Math.max(w * 0.04, 8);

                // 清屏
                ctx.clearRect(0, 0, w, h);

                // 正方形区域
                const sqX = margin;
                const sqY = margin;
                const sqW = w - margin * 2;
                const sqH = h - margin * 2;

                // 绘制白色背景
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(sqX, sqY, sqW, sqH);

                // 绘制正方形边框
                ctx.strokeStyle = '#3a5168';
                ctx.lineWidth = Math.max(2.5, w * 0.007);
                ctx.lineJoin = 'round';
                ctx.strokeRect(sqX, sqY, sqW, sqH);

                // 计算当前动画进度下的竖线和横线
                const effectiveProgress = animationProgress;

                // 竖线（9条）- 在两种模式下都存在
                const numVertLines = 9;
                const colWidth = sqW / 10;
                ctx.strokeStyle = '#c8d4e0';
                ctx.lineWidth = Math.max(1, w * 0.0028);
                for (let i = 1; i <= numVertLines; i++) {
                    const x = sqX + i * colWidth;
                    ctx.beginPath();
                    ctx.moveTo(x, sqY);
                    ctx.lineTo(x, sqY + sqH);
                    ctx.stroke();
                }

                // 横线（9条）- 仅在100格模式下显示，动画中逐渐出现
                if (effectiveProgress > 0.001) {
                    const numHorizLines = 9;
                    const rowHeight = sqH / 10;
                    ctx.strokeStyle = '#c8d4e0';
                    ctx.lineWidth = Math.max(1, w * 0.0028);
                    const alpha = Math.min(1, effectiveProgress);
                    ctx.globalAlpha = alpha;
                    for (let i = 1; i <= numHorizLines; i++) {
                        const y = sqY + i * rowHeight;
                        // 动画：横线从中间向上下展开
                        const midY = sqY + sqH / 2;
                        const lineCenter = midY;
                        const distFromCenter = Math.abs(y - lineCenter) / (sqH / 2);
                        const lineProgress = Math.max(0, Math.min(1, (effectiveProgress - distFromCenter * 0.35) / 0.65));
                        if (lineProgress > 0.01) {
                            const drawLen = sqW * lineProgress;
                            const startX = sqX + sqW / 2 - drawLen / 2;
                            const endX = sqX + sqW / 2 + drawLen / 2;
                            ctx.beginPath();
                            ctx.moveTo(startX, y);
                            ctx.lineTo(endX, y);
                            ctx.stroke();
                        }
                    }
                    ctx.globalAlpha = 1;
                }

                // 绘制高亮区域
                if (currentDecimalValue !== null && currentMode === 'normal') {
                    drawHighlightOnMain(ctx, sqX, sqY, sqW, sqH, effectiveProgress);
                }

                // 在100格模式下绘制更清晰的小格边框（覆盖在竖线之上）
                if (effectiveProgress > 0.85 && splitMode === 'grid100') {
                    const numHorizLines = 9;
                    const rowHeight = sqH / 10;
                    ctx.strokeStyle = '#c8d4e0';
                    ctx.lineWidth = Math.max(1, w * 0.0028);
                    ctx.globalAlpha = effectiveProgress;
                    for (let i = 1; i <= numHorizLines; i++) {
                        const y = sqY + i * rowHeight;
                        ctx.beginPath();
                        ctx.moveTo(sqX, y);
                        ctx.lineTo(sqX + sqW, y);
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                }

                // 边框再描一次确保在最上层
                ctx.strokeStyle = '#3a5168';
                ctx.lineWidth = Math.max(2.5, w * 0.007);
                ctx.lineJoin = 'round';
                ctx.strokeRect(sqX, sqY, sqW, sqH);
            }

            function drawHighlightOnMain(ctx, sqX, sqY, sqW, sqH, progress) {
                const value = currentDecimalValue;
                if (value === null || value >= 1) return;

                if (progress < 0.5) {
                    // 偏向10列模式
                    drawHighlightCols(ctx, sqX, sqY, sqW, sqH, value, progress);
                } else {
                    // 偏向100格模式
                    drawHighlightGrid(ctx, sqX, sqY, sqW, sqH, value, progress);
                }
            }

            function drawHighlightCols(ctx, sqX, sqY, sqW, sqH, value, progress) {
                const colWidth = sqW / 10;
                const fullCols = Math.floor(value * 10);
                const fractionalCol = (value * 10) - fullCols;

                // 高亮整列
                const highlightColor = '#ffb74d';
                const highlightBorder = '#f59320';
                for (let i = 0; i < fullCols; i++) {
                    const x = sqX + i * colWidth;
                    ctx.fillStyle = highlightColor;
                    ctx.fillRect(x + 1.5, sqY + 1.5, colWidth - 3, sqH - 3);
                    ctx.strokeStyle = highlightBorder;
                    ctx.lineWidth = 1.2;
                    ctx.strokeRect(x + 1.5, sqY + 1.5, colWidth - 3, sqH - 3);
                }

                // 部分列（如果存在）
                if (fractionalCol > 0.005 && fullCols < 10) {
                    const x = sqX + fullCols * colWidth;
                    const partialH = sqH * fractionalCol;
                    ctx.fillStyle = '#ffe0b2';
                    ctx.fillRect(x + 1.5, sqY + 1.5, colWidth - 3, partialH - 1.5);
                    ctx.strokeStyle = '#f59320';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 2]);
                    ctx.strokeRect(x + 1.5, sqY + 1.5, colWidth - 3, partialH - 1.5);
                    ctx.setLineDash([]);
                }

                // 如果值为0，显示微弱的提示
                if (value < 0.005 && value !== null) {
                    ctx.fillStyle = 'rgba(255,183,77,0.25)';
                    ctx.fillRect(sqX + 1.5, sqY + 1.5, sqW - 3, sqH - 3);
                }
            }

            function drawHighlightGrid(ctx, sqX, sqY, sqW, sqH, value, progress) {
                const cellW = sqW / 10;
                const cellH = sqH / 10;
                const totalCells = Math.round(value * 100);
                const clampedCells = Math.min(totalCells, 100);

                const highlightColor = '#ffb74d';
                const highlightBorder = '#f59320';

                for (let i = 0; i < clampedCells; i++) {
                    const col = i % 10;
                    const row = Math.floor(i / 10);
                    const cx = sqX + col * cellW;
                    const cy = sqY + row * cellH;
                    ctx.fillStyle = highlightColor;
                    ctx.fillRect(cx + 1.2, cy + 1.2, cellW - 2.4, cellH - 2.4);
                    ctx.strokeStyle = highlightBorder;
                    ctx.lineWidth = 0.8;
                    ctx.strokeRect(cx + 1.2, cy + 1.2, cellW - 2.4, cellH - 2.4);
                }

                if (value < 0.005 && value !== null) {
                    ctx.fillStyle = 'rgba(255,183,77,0.25)';
                    ctx.fillRect(sqX + 1.5, sqY + 1.5, sqW - 3, sqH - 3);
                }
            }

            // ==================== 动画系统 ====================
            function animateToProgress(targetProgress, callback) {
                if (isAnimating) {
                    // 取消当前动画
                    if (animationId) cancelAnimationFrame(animationId);
                    isAnimating = false;
                }
                const startProgress = animationProgress;
                const startTime = performance.now();
                isAnimating = true;

                function easeInOutCubic(t) {
                    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                }

                function step(currentTime) {
                    const elapsed = currentTime - startTime;
                    const rawT = Math.min(elapsed / ANIM_DURATION, 1);
                    const t = easeInOutCubic(rawT);
                    animationProgress = startProgress + (targetProgress - startProgress) * t;
                    drawMainCanvas();

                    if (rawT < 1) {
                        animationId = requestAnimationFrame(step);
                    } else {
                        animationProgress = targetProgress;
                        drawMainCanvas();
                        isAnimating = false;
                        animationId = null;
                        if (callback) callback();
                    }
                }
                animationId = requestAnimationFrame(step);
            }

            // ==================== 设置分割模式 ====================
            function setSplitMode(mode) {
                if (isAnimating) return;
                if (splitMode === mode) return;

                splitMode = mode;
                updateSplitButtons();

                const targetProgress = mode === 'columns10' ? 0 : 1;
                animateToProgress(targetProgress, () => {
                    updateAnimHint();
                    updateFractionDisplay();
                });
                updateAnimHint();
            }

            function updateSplitButtons() {
                if (splitMode === 'columns10') {
                    btnCols10.classList.add('active-split');
                    btnGrid100.classList.remove('active-split');
                } else {
                    btnGrid100.classList.add('active-split');
                    btnCols10.classList.remove('active-split');
                }
            }

            function updateAnimHint() {
                if (splitMode === 'columns10') {
                    animHint.innerHTML = '👆 当前：<strong>10列</strong>模式（每列表示 1/10），点击切换为100小格';
                } else {
                    animHint.innerHTML = '👆 当前：<strong>100小格</strong>模式（每格表示 1/100），点击切换为10列';
                }
            }

            // ==================== 模式切换 ====================
            function switchMode(mode) {
                if (isAnimating) return;
                currentMode = mode;
                if (mode === 'normal') {
                    tabNormal.classList.add('active');
                    tabAdvanced.classList.remove('active');
                    normalDisplay.style.display = 'flex';
                    advancedDisplay.style.display = 'none';
                    inputHint.textContent = '小数：';
                    decimalInput.placeholder = '如 0.3 或 0.25';
                    // 重置为10列模式
                    splitMode = 'columns10';
                    animationProgress = 0;
                    updateSplitButtons();
                    updateAnimHint();
                    currentDecimalValue = null;
                    decimalInput.value = '';
                    fractionDisplay.innerHTML = '<span class="label-text">📝 在此显示小数对应的分数和格子数</span>';
                    initMainCanvas();
                } else {
                    tabAdvanced.classList.add('active');
                    tabNormal.classList.remove('active');
                    normalDisplay.style.display = 'none';
                    advancedDisplay.style.display = 'block';
                    inputHint.textContent = '小数：';
                    decimalInput.placeholder = '如 2.23 或 3.5';
                    currentDecimalValue = null;
                    decimalInput.value = '';
                    fractionDisplay.innerHTML = '<span class="label-text">📝 在此显示小数对应的分数和格子数</span>';
                    advancedSquaresRow.innerHTML =
                        '<div style="text-align:center;color:#8899a6;padding:40px;">🧩 请输入一个大于1的小数<br>（例如：<strong>2.23</strong>），然后点击"生成"</div>';
                }
            }

            // ==================== 生成功能 ====================
            function generate() {
                if (isAnimating) return;
                const rawInput = decimalInput.value.trim();
                if (!rawInput) {
                    shakeInput();
                    showToast('请输入一个小数');
                    return;
                }

                const parsed = parseFloat(rawInput);
                if (isNaN(parsed)) {
                    shakeInput();
                    showToast('请输入有效的小数（如 0.3 或 2.23）');
                    return;
                }

                // 检查小数位数
                const decimalPart = rawInput.split('.')[1] || '';
                if (decimalPart.length > 2) {
                    shakeInput();
                    showToast('请输入一位或两位小数');
                    return;
                }

                if (currentMode === 'normal') {
                    if (parsed < 0 || parsed >= 1) {
                        shakeInput();
                        showToast('普通模式下请输入小于1的小数（0.01 ~ 0.99）');
                        return;
                    }
                    currentDecimalValue = parsed;
                    // 确保主canvas已初始化
                    initMainCanvasSilent();
                    drawMainCanvas();
                    updateFractionDisplay();
                    // 如果输入的是两位小数且当前在10列模式，提示可切换到100格
                    if (decimalPart.length === 2 && splitMode === 'columns10') {
                        animHint.innerHTML =
                            '💡 提示：两位小数在<strong>100小格</strong>模式下更精确，试试切换查看吧！';
                    }
                } else {
                    // 进阶模式
                    if (parsed <= 0) {
                        shakeInput();
                        showToast('进阶模式下请输入大于0的小数');
                        return;
                    }
                    if (parsed < 1 && parsed > 0) {
                        // 小于1但在进阶模式，也接受，但提示
                        currentDecimalValue = parsed;
                        renderAdvancedMode(parsed);
                        updateFractionDisplayAdvanced(parsed);
                        return;
                    }
                    currentDecimalValue = parsed;
                    renderAdvancedMode(parsed);
                    updateFractionDisplayAdvanced(parsed);
                }
            }

            function initMainCanvasSilent() {
                const rect = mainSquareContainer.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const displayWidth = rect.width;
                const displayHeight = rect.height;
                if (displayWidth <= 0 || displayHeight <= 0) {
                    setTimeout(initMainCanvasSilent, 200);
                    return;
                }
                mainCanvas.width = Math.floor(displayWidth * dpr);
                mainCanvas.height = Math.floor(displayHeight * dpr);
                mainCanvas.style.width = displayWidth + 'px';
                mainCanvas.style.height = displayHeight + 'px';
            }

            // ==================== 进阶模式渲染 ====================
            function renderAdvancedMode(value) {
                const intPart = Math.floor(value);
                const decPart = value - intPart;
                const tenths = Math.floor((value * 10) % 10);
                const hundredths = Math.floor((value * 100) % 10);
                const hasTenths = (decPart >= 0.009); // 十分位有意义
                const hasHundredths = (hundredths > 0);

                let html = '';

                // 整数部分 - 完整正方形
                if (intPart > 0) {
                    const displayInt = Math.min(intPart, 20); // 最多显示20个
                    for (let i = 0; i < displayInt; i++) {
                        html += `
                        <div class="square-group">
                            <div class="group-label">整数部分 · 个位</div>
                            <div class="canvas-container sub-square" id="advInt_${i}">
                                <canvas id="advIntCanvas_${i}"></canvas>
                            </div>
                            <div class="group-value">= 1</div>
                        </div>`;
                    }
                    if (intPart > 20) {
                        html +=
                            `<div class="square-group"><div class="group-label">…</div><div style="padding:20px;font-size:1.2rem;font-weight:700;">×${intPart}个</div></div>`;
                    }
                }

                // 十分位正方形
                if (hasTenths || tenths >= 0) {
                    const showTenths = hasTenths || (hundredths > 0 && tenths === 0);
                    if (showTenths || tenths > 0 || (hundredths > 0)) {
                        html += `
                        <div class="square-group">
                            <div class="group-label">十分位 <span style="color:#c0392b;">(0.${tenths})</span></div>
                            <div class="canvas-container sub-square" id="advTenths">
                                <canvas id="advTenthsCanvas"></canvas>
                            </div>
                            <div class="group-value">10列中取 <strong>${tenths}</strong> 列 = ${tenths}/10</div>
                        </div>`;
                    }
                }

                // 百分位正方形
                if (hasHundredths) {
                    html += `
                    <div class="square-group">
                        <div class="group-label">百分位 <span style="color:#c0392b;">(0.0${hundredths})</span></div>
                        <div class="canvas-container sub-square-small" id="advHundredths">
                            <canvas id="advHundredthsCanvas"></canvas>
                        </div>
                        <div class="group-value">100格中取 <strong>${hundredths}</strong> 格 = ${hundredths}/100</div>
                    </div>`;
                }

                advancedSquaresRow.innerHTML = html;

                // 延迟绘制各个canvas
                setTimeout(() => {
                    // 绘制整数正方形
                    for (let i = 0; i < Math.min(intPart, 20); i++) {
                        const c = document.getElementById('advIntCanvas_' + i);
                        if (c) drawFullSquare(c, '#ffb74d');
                    }
                    // 绘制十分位正方形
                    const tc = document.getElementById('advTenthsCanvas');
                    if (tc) drawTenthsSquare(tc, tenths);
                    // 绘制百分位正方形
                    const hc = document.getElementById('advHundredthsCanvas');
                    if (hc) drawHundredthsSquare(hc, hundredths);
                }, 150);
            }

            function drawFullSquare(canvas, fillColor) {
                const container = canvas.parentElement;
                const rect = container.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const w = rect.width;
                const h = rect.height;
                if (w <= 0 || h <= 0) {
                    setTimeout(() => drawFullSquare(canvas, fillColor), 100);
                    return;
                }
                canvas.width = Math.floor(w * dpr);
                canvas.height = Math.floor(h * dpr);
                const ctx = canvas.getContext('2d');
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
                const margin = w * 0.06;
                const sqX = margin;
                const sqY = margin;
                const sqW = w - margin * 2;
                const sqH = h - margin * 2;
                ctx.fillStyle = fillColor;
                ctx.fillRect(sqX, sqY, sqW, sqH);
                ctx.strokeStyle = '#3a5168';
                ctx.lineWidth = Math.max(2, w * 0.008);
                ctx.lineJoin = 'round';
                ctx.strokeRect(sqX, sqY, sqW, sqH);
            }

            function drawTenthsSquare(canvas, highlightedCols) {
                const container = canvas.parentElement;
                const rect = container.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const w = rect.width;
                const h = rect.height;
                if (w <= 0 || h <= 0) {
                    setTimeout(() => drawTenthsSquare(canvas, highlightedCols), 100);
                    return;
                }
                canvas.width = Math.floor(w * dpr);
                canvas.height = Math.floor(h * dpr);
                const ctx = canvas.getContext('2d');
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
                const margin = w * 0.06;
                const sqX = margin;
                const sqY = margin;
                const sqW = w - margin * 2;
                const sqH = h - margin * 2;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(sqX, sqY, sqW, sqH);
                const colW = sqW / 10;
                // 高亮列
                for (let i = 0; i < highlightedCols; i++) {
                    ctx.fillStyle = '#ffb74d';
                    ctx.fillRect(sqX + i * colW + 1, sqY + 1, colW - 2, sqH - 2);
                    ctx.strokeStyle = '#f59320';
                    ctx.lineWidth = 0.8;
                    ctx.strokeRect(sqX + i * colW + 1, sqY + 1, colW - 2, sqH - 2);
                }
                // 竖线
                ctx.strokeStyle = '#c8d4e0';
                ctx.lineWidth = Math.max(0.8, w * 0.0025);
                for (let i = 1; i <= 9; i++) {
                    const x = sqX + i * colW;
                    ctx.beginPath();
                    ctx.moveTo(x, sqY);
                    ctx.lineTo(x, sqY + sqH);
                    ctx.stroke();
                }
                // 边框
                ctx.strokeStyle = '#3a5168';
                ctx.lineWidth = Math.max(2, w * 0.008);
                ctx.lineJoin = 'round';
                ctx.strokeRect(sqX, sqY, sqW, sqH);
            }

            function drawHundredthsSquare(canvas, highlightedCells) {
                const container = canvas.parentElement;
                const rect = container.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const w = rect.width;
                const h = rect.height;
                if (w <= 0 || h <= 0) {
                    setTimeout(() => drawHundredthsSquare(canvas, highlightedCells), 100);
                    return;
                }
                canvas.width = Math.floor(w * dpr);
                canvas.height = Math.floor(h * dpr);
                const ctx = canvas.getContext('2d');
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
                const margin = w * 0.06;
                const sqX = margin;
                const sqY = margin;
                const sqW = w - margin * 2;
                const sqH = h - margin * 2;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(sqX, sqY, sqW, sqH);
                const cellW = sqW / 10;
                const cellH = sqH / 10;
                // 高亮小格
                for (let i = 0; i < highlightedCells; i++) {
                    const col = i % 10;
                    const row = Math.floor(i / 10);
                    ctx.fillStyle = '#ffb74d';
                    ctx.fillRect(sqX + col * cellW + 0.8, sqY + row * cellH + 0.8, cellW - 1.6, cellH - 1.6);
                    ctx.strokeStyle = '#f59320';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(sqX + col * cellW + 0.8, sqY + row * cellH + 0.8, cellW - 1.6, cellH - 1.6);
                }
                // 网格线
                ctx.strokeStyle = '#c8d4e0';
                ctx.lineWidth = Math.max(0.5, w * 0.002);
                for (let i = 1; i <= 9; i++) {
                    const x = sqX + i * cellW;
                    ctx.beginPath();
                    ctx.moveTo(x, sqY);
                    ctx.lineTo(x, sqY + sqH);
                    ctx.stroke();
                    const y = sqY + i * cellH;
                    ctx.beginPath();
                    ctx.moveTo(sqX, y);
                    ctx.lineTo(sqX + sqW, y);
                    ctx.stroke();
                }
                // 边框
                ctx.strokeStyle = '#3a5168';
                ctx.lineWidth = Math.max(2, w * 0.008);
                ctx.lineJoin = 'round';
                ctx.strokeRect(sqX, sqY, sqW, sqH);
            }

            // ==================== 分数显示更新 ====================
            function updateFractionDisplay() {
                if (currentDecimalValue === null || currentMode !== 'normal') {
                    if (currentMode === 'normal' && currentDecimalValue === null) {
                        fractionDisplay.innerHTML =
                        '<span class="label-text">📝 在此显示小数对应的分数和格子数</span>';
                    }
                    return;
                }
                const value = currentDecimalValue;
                const decimalStr = value.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
                let fractionHTML = '';
                let gridCountText = '';

                if (splitMode === 'columns10') {
                    const fullCols = Math.floor(value * 10);
                    const fracCol = (value * 10) - fullCols;
                    const totalColsDisplay = (value * 10).toFixed(1).replace(/\.0$/, '');
                    fractionHTML = renderFraction(Math.round(value * 10), 10);
                    if (fracCol < 0.005) {
                        gridCountText = `<span class="grid-count">${fullCols} 列</span>（每列=1/10）`;
                    } else {
                        gridCountText =
                            `<span class="grid-count">约 ${totalColsDisplay} 列</span>（其中 ${fullCols} 整列 + 部分列）`;
                    }
                } else {
                    const totalCells = Math.round(value * 100);
                    fractionHTML = renderFraction(totalCells, 100);
                    gridCountText = `<span class="grid-count">${totalCells} 小格</span>（每格=1/100）`;
                }

                fractionDisplay.innerHTML = `
                    <span class="label-text">小数 <strong style="color:#c0392b;font-size:1.2rem;">${decimalStr}</strong></span>
                    <span class="equals">=</span>
                    ${fractionHTML}
                    <span class="equals">→</span>
                    ${gridCountText}
                `;
            }

            function updateFractionDisplayAdvanced(value) {
                const intPart = Math.floor(value);
                const tenths = Math.floor((value * 10) % 10);
                const hundredths = Math.floor((value * 100) % 10);
                const decimalStr = value.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');

                let parts = [];
                if (intPart > 0) parts.push(`<strong>${intPart}</strong> 个完整的正方形`);
                if (tenths > 0 || (hundredths > 0)) {
                    parts.push(
                        `十分位 <strong>${tenths}/10</strong>（${tenths}列）`);
                }
                if (hundredths > 0) {
                    parts.push(`百分位 <strong>${hundredths}/100</strong>（${hundredths}小格）`);
                }

                fractionDisplay.innerHTML = `
                    <span class="label-text">小数 <strong style="color:#c0392b;font-size:1.2rem;">${decimalStr}</strong></span>
                    <span class="equals">=</span>
                    <span style="font-weight:600;">${intPart} + 0.${tenths}${hundredths > 0 ? '' + hundredths : ''}</span>
                    <span style="color:#5a6c7d;font-size:0.9rem;">（${parts.join('，')}）</span>
                `;
            }

            function renderFraction(numerator, denominator) {
                return `
                <span class="frac-box">
                    <span class="numerator">${numerator}</span>
                    <span class="frac-line"></span>
                    <span class="denominator">${denominator}</span>
                </span>`;
            }

            // ==================== 重置 ====================
            function resetAll() {
                if (isAnimating) {
                    if (animationId) cancelAnimationFrame(animationId);
                    isAnimating = false;
                    animationId = null;
                }
                currentDecimalValue = null;
                decimalInput.value = '';
                if (currentMode === 'normal') {
                    splitMode = 'columns10';
                    animationProgress = 0;
                    updateSplitButtons();
                    updateAnimHint();
                    initMainCanvasSilent();
                    drawMainCanvas();
                } else {
                    advancedSquaresRow.innerHTML =
                        '<div style="text-align:center;color:#8899a6;padding:40px;">🧩 请输入一个大于1的小数<br>（例如：<strong>2.23</strong>），然后点击"生成"</div>';
                }
                fractionDisplay.innerHTML = '<span class="label-text">📝 在此显示小数对应的分数和格子数</span>';
                showToast('已重置 ✓');
            }

            // ==================== 辅助功能 ====================
            function shakeInput() {
                decimalInput.style.animation = 'none';
                decimalInput.offsetHeight;
                decimalInput.style.animation = 'shake 0.5s ease';
                setTimeout(() => {
                    decimalInput.style.animation = '';
                }, 500);
            }

            function showToast(msg) {
                let toast = document.getElementById('toastMsg');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = 'toastMsg';
                    toast.style.cssText = `
                        position:fixed;top:20px;left:50%;transform:translateX(-50%);
                        background:#e74c3c;color:#fff;padding:10px 22px;border-radius:22px;
                        font-weight:600;font-size:0.9rem;z-index:9999;pointer-events:none;
                        opacity:0;transition:opacity 0.35s ease;
                        box-shadow:0 4px 16px rgba(231,76,60,0.4);
                        font-family:var(--font-family);
                    `;
                    document.body.appendChild(toast);
                }
                toast.textContent = '⚠ ' + msg;
                toast.style.opacity = '1';
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => {
                    toast.style.opacity = '0';
                }, 1800);
            }

            // 添加shake动画
            const shakeStyle = document.createElement('style');
            shakeStyle.textContent = `
                @keyframes shake {
                    0%,100% { transform:translateX(0); }
                    20% { transform:translateX(-6px); }
                    40% { transform:translateX(6px); }
                    60% { transform:translateX(-4px); }
                    80% { transform:translateX(4px); }
                }
            `;
            document.head.appendChild(shakeStyle);

            // ==================== 事件监听 ====================
            decimalInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    generate();
                }
            });

            // 窗口大小改变时重新初始化
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    if (currentMode === 'normal') {
                        initMainCanvasSilent();
                        drawMainCanvas();
                    } else if (currentDecimalValue !== null) {
                        renderAdvancedMode(currentDecimalValue);
                    }
                }, 300);
            });

            // ==================== 初始化 ====================
            function init() {
                updateSplitButtons();
                updateAnimHint();
                initMainCanvas();
                // 初始绘制空正方形
                setTimeout(() => {
                    initMainCanvasSilent();
                    drawMainCanvas();
                }, 200);
            }

            // 暴露函数到全局
            window.switchMode = switchMode;
            window.setSplitMode = setSplitMode;
            window.generate = generate;
            window.resetAll = resetAll;

            // 启动
            init();

            // 再次尝试初始化（处理字体加载等延迟）
            setTimeout(() => {
                if (currentMode === 'normal') {
                    initMainCanvasSilent();
                    drawMainCanvas();
                }
            }, 600);

            console.log('📐 小数拆解实验室 - 小数的意义 已就绪');
            console.log('   普通模式：输入小于1的小数，观察10列/100格分割');
            console.log('   进阶模式：输入大于1的小数，查看完整图示');
        })();
    </script>
</body>
</html>
